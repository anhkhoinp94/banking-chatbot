services:
  ollama:
    image: local-ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - banking_chatbot_network

  chromadb:
    image: chromadb/chroma
    container_name: chromadb
    ports:
      - "8001:8000"
    volumes:
      - chromadb_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - banking_chatbot_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: backend
    depends_on:
      - ollama
      - chromadb
    environment:
      - OLLAMA_HOST=ollama
      - OLLAMA_PORT=11434
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    networks:
      - banking_chatbot_network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: frontend
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8000/chat
    ports:
      - "8501:8501"
    volumes:
      - ./frontend:/app
    networks:
      - banking_chatbot_network

volumes:
  ollama_data:
  chromadb_data:

networks:
  banking_chatbot_network:
    name: banking_chatbot_network
